<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>进制转换 - Web IT Tool Box</title>
  <meta name="description" content="在线进制转换：二进制、八进制、十进制、十六进制、三十六进制互转，基于 BigInt 支持超大整数，全部本地计算。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔟</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/common.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="/">
        <span class="logo-icon">🧰</span>
        <span>Web IT Tool Box</span>
      </a>
      <span class="header-spacer"></span>
      <a class="header-nav" href="/">🏠 返回工具箱</a>
    </div>
  </header>

  <main class="narrow">

    <div class="page-head">
      <div class="crumbs"><a href="/">工具箱</a> / 进制转换</div>
      <h1><span class="icon-tile cat-dev">🔟</span>进制转换</h1>
      <p class="sub">2 / 8 / 10 / 16 / 36 进制互转，基于 BigInt，支持超大整数（仅非负整数）。</p>
    </div>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>输入</div>
      <label class="field-label" for="baseInput">数值</label>
      <input type="text" id="baseInput" class="mono" placeholder="例如：255、0xFF、1010、zz" autocomplete="off" spellcheck="false">
      <div class="unit-switch">
        <span class="field-label" style="margin:0;">当前进制：</span>
        <label class="radio-label"><input type="radio" name="baseFrom" value="2"> 二进制</label>
        <label class="radio-label"><input type="radio" name="baseFrom" value="8"> 八进制</label>
        <label class="radio-label"><input type="radio" name="baseFrom" value="10" checked> 十进制</label>
        <label class="radio-label"><input type="radio" name="baseFrom" value="16"> 十六进制</label>
        <label class="radio-label"><input type="radio" name="baseFrom" value="36"> 三十六进制</label>
      </div>
      <p class="hint" id="baseHint">输入数值后自动转换，十六进制可带 0x 前缀。</p>
    </section>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>转换结果</div>
      <div class="result-list">
        <div class="result-row">
          <span class="r-label">二进制</span>
          <span class="r-value" id="rBin">—</span>
          <button class="copy-btn" data-copy-target="rBin">复制</button>
        </div>
        <div class="result-row">
          <span class="r-label">八进制</span>
          <span class="r-value" id="rOct">—</span>
          <button class="copy-btn" data-copy-target="rOct">复制</button>
        </div>
        <div class="result-row">
          <span class="r-label">十进制</span>
          <span class="r-value" id="rDec">—</span>
          <button class="copy-btn" data-copy-target="rDec">复制</button>
        </div>
        <div class="result-row">
          <span class="r-label">十六进制</span>
          <span class="r-value" id="rHex">—</span>
          <button class="copy-btn" data-copy-target="rHex">复制</button>
        </div>
        <div class="result-row">
          <span class="r-label">三十六进制</span>
          <span class="r-value" id="rB36">—</span>
          <button class="copy-btn" data-copy-target="rB36">复制</button>
        </div>
      </div>
      <div class="stat-bar" id="baseStats"></div>
    </section>

  </main>

  <footer class="site-footer">
    基于 <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a> 免费服务构建
    <span class="sep">|</span>
    <a href="https://github.com/junwindxqw/cloudflare_web_it_tool_box" target="_blank" rel="noopener">GitHub 开源</a>
  </footer>

  <div id="toast">已复制到剪贴板</div>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);

    let toastTimer = null;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      const text = $(btn.dataset.copyTarget)?.textContent ?? '';
      if (!text || text === '—') return;
      try {
        await navigator.clipboard.writeText(text);
        toast('已复制到剪贴板');
      } catch {
        toast('复制失败，请手动选择复制');
      }
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1200);
    });

    const BASE_NAMES = { 2: '二进制', 8: '八进制', 10: '十进制', 16: '十六进制', 36: '三十六进制' };

    function convertBase() {
      const raw = $('baseInput').value.trim();
      const base = Number(document.querySelector('input[name="baseFrom"]:checked').value);
      const ids = ['rBin', 'rOct', 'rDec', 'rHex', 'rB36'];
      const hint = $('baseHint');
      const stats = $('baseStats');

      ids.forEach(id => { $(id).textContent = '—'; });
      stats.innerHTML = '';

      if (!raw) {
        hint.textContent = '输入数值后自动转换，十六进制可带 0x 前缀。';
        hint.classList.remove('err');
        return;
      }

      let s = raw.toLowerCase().replace(/[\s,_]/g, '');
      if (base === 16 && s.startsWith('0x')) s = s.slice(2);
      if (base === 2 && s.startsWith('0b')) s = s.slice(2);
      if (base === 8 && s.startsWith('0o')) s = s.slice(2);

      const digits = '0123456789abcdefghijklmnopqrstuvwxyz';
      if (!s || s.split('').some(ch => !digits.slice(0, base).includes(ch))) {
        hint.textContent = `「${raw}」不是合法的${BASE_NAMES[base]}数（可用字符：${digits.slice(0, base)}）`;
        hint.classList.add('err');
        return;
      }

      const big = s.split('').reduce((acc, ch) => acc * BigInt(base) + BigInt(digits.indexOf(ch)), 0n);

      $('rBin').textContent = big.toString(2);
      $('rOct').textContent = big.toString(8);
      $('rDec').textContent = big.toString(10);
      $('rHex').textContent = big.toString(16).toUpperCase();
      $('rB36').textContent = big.toString(36);

      hint.classList.remove('err');
      hint.textContent = `已按${BASE_NAMES[base]}解析：${s}`;
      const bits = big === 0n ? 1 : big.toString(2).length;
      stats.innerHTML =
        `<span>位宽（无符号）：<strong>${bits}</strong> bit</span>` +
        `<span>字节：<strong>${Math.ceil(bits / 8)}</strong> B</span>` +
        (big === 0n ? '' : `<span>是否 2 的幂：<strong>${(big & (big - 1n)) === 0n ? '是' : '否'}</strong></span>`);
    }

    $('baseInput').addEventListener('input', convertBase);
    document.querySelectorAll('input[name="baseFrom"]').forEach(r => r.addEventListener('change', convertBase));
  </script>
</body>
</html>
