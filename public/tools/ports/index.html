<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常用端口速查 - Web IT Tool Box</title>
  <meta name="description" content="常用网络端口速查表：涵盖 FTP、SSH、HTTP、HTTPS、数据库、消息队列等常见端口及协议说明，支持搜索。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚪</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/common.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="/">
        <span class="logo-icon">🧰</span>
        <span>Web IT Tool Box</span>
      </a>
      <span class="header-spacer"></span>
      <a class="header-nav" href="/">🏠 返回工具箱</a>
    </div>
  </header>

  <main class="narrow">

    <div class="page-head">
      <div class="crumbs"><a href="/">工具箱</a> / 常用端口速查</div>
      <h1><span class="icon-tile cat-ops">🚪</span>常用端口速查</h1>
      <p class="sub">运维常用端口及对应服务一览，支持搜索与协议过滤。</p>
    </div>

    <section class="panel">
      <input type="text" id="portSearch" placeholder="搜索端口或服务，如：3306、mysql、http…" autocomplete="off" spellcheck="false">
    </section>

    <section class="panel">
      <div style="overflow-x:auto;">
        <table class="char-table" id="portTable">
          <thead><tr><th style="width:90px;">端口</th><th style="width:80px;">协议</th><th style="width:170px;">服务</th><th>说明</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="hint" id="portCount"></p>
    </section>

  </main>

  <footer class="site-footer">
    基于 <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a> 免费服务构建
    <span class="sep">|</span>
    <a href="https://github.com/junwindxqw/cloudflare_web_it_tool_box" target="_blank" rel="noopener">GitHub 开源</a>
  </footer>

  <div id="toast">已复制到剪贴板</div>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);

    const PORTS = [
      ['20/21', 'TCP', 'FTP', '文件传输协议（数据/控制端口），明文传输建议改用 SFTP'],
      ['22', 'TCP', 'SSH / SFTP / SCP', '加密远程登录与文件传输，Linux 服务器标配'],
      ['23', 'TCP', 'Telnet', '明文远程登录，已不安全，基本淘汰'],
      ['25', 'TCP', 'SMTP', '邮件发送（服务器间投递），云厂商默认封禁'],
      ['53', 'TCP/UDP', 'DNS', '域名解析查询'],
      ['67/68', 'UDP', 'DHCP', '自动分配 IP 地址（服务器/客户端）'],
      ['69', 'UDP', 'TFTP', '简单文件传输，常用于 PXE 网络装机'],
      ['80', 'TCP', 'HTTP', '网页默认端口'],
      ['110', 'TCP', 'POP3', '邮件收取（旧）'],
      ['143', 'TCP', 'IMAP', '邮件收取（支持多端同步）'],
      ['161/162', 'UDP', 'SNMP', '网络设备监控与陷阱消息'],
      ['389', 'TCP/UDP', 'LDAP', '目录服务（明文），加密版为 636'],
      ['443', 'TCP', 'HTTPS', 'TLS 加密网页端口'],
      ['445', 'TCP', 'SMB', 'Windows 文件共享，勒索病毒高危端口'],
      ['465', 'TCP', 'SMTPS', 'SMTP over SSL 邮件发送'],
      ['587', 'TCP', 'SMTP（提交）', '客户端邮件提交端口，配合 STARTTLS'],
      ['636', 'TCP', 'LDAPS', 'LDAP over SSL'],
      ['993', 'TCP', 'IMAPS', 'IMAP over SSL'],
      ['995', 'TCP', 'POP3S', 'POP3 over SSL'],
      ['1080', 'TCP', 'SOCKS 代理', 'SOCKS4/5 代理服务'],
      ['1433', 'TCP', 'SQL Server', '微软数据库默认端口'],
      ['1521', 'TCP', 'Oracle', 'Oracle 数据库默认监听端口'],
      ['2049', 'TCP/UDP', 'NFS', '网络文件系统共享'],
      ['2181', 'TCP', 'ZooKeeper', '分布式协调服务客户端端口'],
      ['2375/2376', 'TCP', 'Docker', 'Docker Remote API（2376 为 TLS），公网暴露极危险'],
      ['3000', 'TCP', 'Grafana / Node 开发', '常用 Web 面板与开发端口'],
      ['3306', 'TCP', 'MySQL / MariaDB', 'MySQL 数据库默认端口'],
      ['3389', 'TCP', 'RDP', 'Windows 远程桌面，暴露公网易被爆破'],
      ['5432', 'TCP', 'PostgreSQL', 'PostgreSQL 数据库默认端口'],
      ['5555', 'TCP', 'ADB', 'Android 调试桥网络调试'],
      ['5672', 'TCP', 'RabbitMQ (AMQP)', 'AMQP 消息队列默认端口'],
      ['5900', 'TCP', 'VNC', 'VNC 远程桌面（5900 + 显示号）'],
      ['6379', 'TCP', 'Redis', 'Redis 默认端口，无密码暴露公网极危险'],
      ['6443', 'TCP', 'Kubernetes API', 'K8s API Server HTTPS 端口'],
      ['8080', 'TCP', 'HTTP 备用', '常见 Web 应用 / Tomcat / 代理端口'],
      ['8443', 'TCP', 'HTTPS 备用', '常见 Web 应用 HTTPS 端口'],
      ['8848', 'TCP', 'Nacos', 'Nacos 注册/配置中心控制台'],
      ['9092', 'TCP', 'Kafka', 'Kafka broker 客户端端口'],
      ['9200/9300', 'TCP', 'Elasticsearch', 'REST API / 节点通信端口'],
      ['11211', 'TCP/UDP', 'Memcached', '分布式缓存，曾被打反射攻击利用'],
      ['27017', 'TCP', 'MongoDB', 'MongoDB 默认端口'],
      ['6653', 'TCP', 'OpenFlow', 'SDN 控制器与交换机通信'],
    ];

    function render(filter) {
      const q = (filter || '').trim().toLowerCase();
      const tbody = $('portTable').querySelector('tbody');
      tbody.innerHTML = '';
      let shown = 0;
      PORTS.forEach(([port, proto, svc, desc]) => {
        if (q && !(port.includes(q) || svc.toLowerCase().includes(q) || desc.toLowerCase().includes(q))) return;
        shown++;
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td><strong>${port}</strong></td><td>${proto}</td><td>${svc}</td><td>${desc}</td>`;
        tbody.appendChild(tr);
      });
      $('portCount').textContent = `共 ${shown} / ${PORTS.length} 条记录`;
    }

    $('portSearch').addEventListener('input', (e) => render(e.target.value));
    render('');
  </script>
</body>
</html>
