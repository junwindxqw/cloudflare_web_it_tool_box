<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色转换 - Web IT Tool Box</title>
  <meta name="description" content="在线颜色格式转换工具：HEX / RGB / HSL 互转，支持透明度与取色器，实时预览，全部计算在浏览器本地完成。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/common.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="/">
        <span class="logo-icon">🧰</span>
        <span>Web IT Tool Box</span>
      </a>
      <span class="header-spacer"></span>
      <a class="header-nav" href="/">🏠 返回工具箱</a>
    </div>
  </header>

  <main class="narrow">

    <div class="page-head">
      <div class="crumbs"><a href="/">工具箱</a> / 颜色转换</div>
      <h1><span class="icon-tile cat-design">🎨</span>颜色转换</h1>
      <p class="sub">HEX / RGB / HSL 互转，支持透明度与取色器，实时预览，所有计算均在浏览器本地完成。</p>
    </div>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>输入颜色</div>
      <div style="display:flex; gap:12px; align-items:center;">
        <input type="text" id="colorInput" class="mono" style="flex:1;" placeholder="#3b82f6、rgb(59, 130, 246)、hsl(217, 91%, 60%)…" autocomplete="off" spellcheck="false">
        <input type="color" id="colorPicker" value="#3b82f6" title="取色器" style="width:52px; height:42px; padding:2px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); cursor:pointer;">
      </div>
      <p class="hint">支持格式：<code>#rgb</code>、<code>#rrggbb</code>、<code>#rrggbbaa</code>、<code>rgb()/rgba()</code>、<code>hsl()/hsla()</code>（逗号或空格分隔均可）。输入变化时实时转换。</p>
      <div id="errBox" class="err-box" hidden></div>
    </section>

    <section class="panel">
      <div class="panel-title"><span class="dot"></span>预览与结果</div>
      <div class="swatch" id="swatch"><span id="swatchText">—</span></div>

      <div class="result-list">
        <div class="result-row">
          <span class="r-label">HEX</span>
          <span class="r-value" id="rHex">—</span>
          <button class="copy-btn" data-copy-target="rHex">复制</button>
        </div>
        <div class="result-row">
          <span class="r-label">RGB</span>
          <span class="r-value" id="rRgb">—</span>
          <button class="copy-btn" data-copy-target="rRgb">复制</button>
        </div>
        <div class="result-row">
          <span class="r-label">HSL</span>
          <span class="r-value" id="rHsl">—</span>
          <button class="copy-btn" data-copy-target="rHsl">复制</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    基于 <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a> 免费服务构建
    <span class="sep">|</span>
    <a href="https://github.com/junwindxqw/cloudflare_web_it_tool_box" target="_blank" rel="noopener">GitHub 开源</a>
  </footer>

  <div id="toast">已复制到剪贴板</div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const inputEl = $('colorInput'), errBox = $('errBox');

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1600);
    }

    /* ---------- 解析任意颜色输入 → {r,g,b,a} ---------- */
    function parseColor(str) {
      const s = str.trim().toLowerCase();
      if (!s) return null;

      // HEX：#rgb / #rgba / #rrggbb / #rrggbbaa
      let m = s.match(/^#([0-9a-f]{3,8})$/);
      if (m) {
        const h = m[1];
        if (h.length === 3 || h.length === 4) {
          const v = h.split('').map(c => parseInt(c + c, 16));
          return { r: v[0], g: v[1], b: v[2], a: h.length === 4 ? +(v[3] / 255).toFixed(3) : 1 };
        }
        if (h.length === 6 || h.length === 8) {
          return {
            r: parseInt(h.slice(0, 2), 16),
            g: parseInt(h.slice(2, 4), 16),
            b: parseInt(h.slice(4, 6), 16),
            a: h.length === 8 ? +(parseInt(h.slice(6, 8), 16) / 255).toFixed(3) : 1,
          };
        }
        return null;
      }

      // rgb() / rgba()
      m = s.match(/^rgba?\(([^)]+)\)$/);
      if (m) {
        const parts = m[1].split(/[,/\s]+/).filter(Boolean);
        if (parts.length < 3) return null;
        const [r, g, b, a] = parts;
        const rgb = [r, g, b].map(v => {
          if (v.endsWith('%')) return Math.round(parseFloat(v) * 2.55);
          const n = Number(v);
          return Number.isFinite(n) ? Math.round(n) : NaN;
        });
        if (rgb.some(n => n < 0 || n > 255 || Number.isNaN(n))) return null;
        let alpha = 1;
        if (a !== undefined) {
          alpha = a.endsWith('%') ? parseFloat(a) / 100 : Number(a);
          if (!Number.isFinite(alpha) || alpha < 0 || alpha > 1) return null;
        }
        return { r: rgb[0], g: rgb[1], b: rgb[2], a: +alpha.toFixed(3) };
      }

      // hsl() / hsla()
      m = s.match(/^hsla?\(([^)]+)\)$/);
      if (m) {
        const parts = m[1].split(/[,/\s]+/).filter(Boolean);
        if (parts.length < 3) return null;
        const h = parseFloat(parts[0]);
        const sat = parseFloat(parts[1]);
        const lig = parseFloat(parts[2]);
        let a = 1;
        if (parts[3] !== undefined) {
          a = parts[3].endsWith('%') ? parseFloat(parts[3]) / 100 : Number(parts[3]);
        }
        if (![h, sat, lig, a].every(Number.isFinite)) return null;
        if (sat < 0 || sat > 100 || lig < 0 || lig > 100 || a < 0 || a > 1) return null;
        return { ...hslToRgb(((h % 360) + 360) % 360, sat, lig), a: +a.toFixed(3) };
      }
      return null;
    }

    /* ---------- 转换算法 ---------- */
    function hslToRgb(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) };
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      let h = 0, s = 0;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          default: h = (r - g) / d + 4;
        }
        h = Math.round(h * 60);
      }
      return { h, s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    const toHex2 = (n) => n.toString(16).padStart(2, '0');

    /* ---------- 渲染 ---------- */
    function convert() {
      const c = parseColor(inputEl.value);
      if (!inputEl.value.trim()) {
        hideErr();
        $('swatch').style.background = '';
        $('swatchText').textContent = '—';
        $('rHex').textContent = $('rRgb').textContent = $('rHsl').textContent = '—';
        return;
      }
      if (!c) {
        showErr('❌ 无法识别的颜色格式，请检查输入（支持 HEX / rgb() / hsl()）');
        return;
      }
      hideErr();
      const { r, g, b, a } = c;
      const hex = a < 1
        ? `#${toHex2(r)}${toHex2(g)}${toHex2(b)}${toHex2(Math.round(a * 255))}`
        : `#${toHex2(r)}${toHex2(g)}${toHex2(b)}`;
      const rgbStr = a < 1 ? `rgba(${r}, ${g}, ${b}, ${a})` : `rgb(${r}, ${g}, ${b})`;
      const { h, s, l } = rgbToHsl(r, g, b);
      const hslStr = a < 1 ? `hsla(${h}, ${s}%, ${l}%, ${a})` : `hsl(${h}, ${s}%, ${l}%)`;

      $('swatch').style.background = `rgba(${r}, ${g}, ${b}, ${a})`;
      $('swatchText').textContent = hex;
      $('rHex').textContent = hex;
      $('rRgb').textContent = rgbStr;
      $('rHsl').textContent = hslStr;
    }

    function showErr(msg) { errBox.hidden = false; errBox.textContent = msg; }
    function hideErr() { errBox.hidden = true; }

    inputEl.addEventListener('input', convert);
    $('colorPicker').addEventListener('input', (e) => {
      inputEl.value = e.target.value;
      convert();
    });

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      const text = $(btn.dataset.copyTarget)?.textContent ?? '';
      if (!text || text === '—') return;
      try {
        await navigator.clipboard.writeText(text);
        toast('已复制到剪贴板');
      } catch { toast('复制失败，请手动选择复制'); }
    });

    // 初始化示例颜色
    inputEl.value = '#3b82f6';
    convert();
  </script>
</body>
</html>
