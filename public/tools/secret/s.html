<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查看私密内容 - Web IT Tool Box</title>
  <meta name="description" content="输入解密密钥查看端到端加密的私密内容。">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗝️</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/secret.css">
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/secret-crypto.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="/">
        <span class="logo-icon">🧰</span>
        <span>Web IT Tool Box</span>
      </a>
      <span class="header-spacer"></span>
      <a class="header-nav" href="/">🏠 返回工具箱</a>
    </div>
  </header>

  <main class="narrow viewer-wrap">

    <div class="page-head">
      <div class="crumbs"><a href="/">工具箱</a> / <a href="/tools/secret/">私密内容分享</a> / 查看</div>
      <h1><span class="icon-tile cat-dev">🔓</span>查看私密内容</h1>
      <p class="sub" id="pageSub">正在校验密钥…</p>
    </div>

    <section class="panel" id="stage">
      <div class="lock-state">
        <span class="ls-icon">⏳</span>
        <div class="ls-title">加载中</div>
        <div class="ls-sub">正在从服务器获取加密内容…</div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    基于 <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a> 免费服务构建
    <span class="sep">|</span>
    <a href="/tools/secret/">🗝️ 我也要创建一个</a>
  </footer>

  <div id="toast">已复制到剪贴板</div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const stage = $('stage');

    /* ---------- 从 URL 提取 id 与密钥 ---------- */
    const pathMatch = location.pathname.match(/^\/s\/([A-Za-z0-9_-]{16,32})/);
    const secretId = pathMatch ? pathMatch[1] : null;

    let keyFromHash = '';
    if (location.hash.length > 1) {
      try { keyFromHash = decodeURIComponent(location.hash.slice(1)); } catch { keyFromHash = location.hash.slice(1); }
    }

    /* ---------- 会话级缓存：刷新页面不丢内容（尤其阅后即焚） ---------- */
    const CACHE_KEY = 'witb-sec-view-' + secretId;
    function readCache() {
      try {
        const raw = sessionStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || typeof obj.text !== 'string') return null;
        if (obj.expiresAt && obj.expiresAt <= Date.now()) { sessionStorage.removeItem(CACHE_KEY); return null; }
        return obj;
      } catch { return null; }
    }
    function writeCache(text, expiresAt, burn, createdAt) {
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ text, expiresAt, burn, createdAt }));
      } catch { /* 容量不足等情况忽略 */ }
    }

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1600);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- 视图：链接无效 ---------- */
    function renderInvalid(msg) {
      $('pageSub').textContent = '链接无效';
      stage.innerHTML =
        '<div class="lock-state">' +
          '<span class="ls-icon">🚫</span>' +
          '<div class="ls-title">' + escapeHtml(msg || '链接无效') + '</div>' +
          '<div class="ls-sub">可能是链接被截断，或该内容已被销毁。</div>' +
          '<a class="btn primary" href="/tools/secret/">创建一个私密分享</a>' +
        '</div>';
    }

    /* ---------- 视图：需要输入密钥 ---------- */
    function renderLock(errMsg) {
      $('pageSub').textContent = '需要解密密钥';
      stage.innerHTML =
        '<div class="lock-state">' +
          '<span class="ls-icon">' + (errMsg ? '🔑' : '🔒') + '</span>' +
          '<div class="ls-title">' + (errMsg ? '密钥不正确' : '这条内容已加密') + '</div>' +
          '<div class="ls-sub">' + (errMsg
            ? escapeHtml(errMsg)
            : '链接中没有携带密钥（# 后面的部分）。请输入分享者给你的密钥：') + '</div>' +
          '<form class="ls-form" id="keyForm" autocomplete="off">' +
            '<input type="text" id="keyInput" placeholder="粘贴解密密钥…" spellcheck="false" autofocus>' +
            '<button type="submit" class="btn primary">解密</button>' +
          '</form>' +
          (errMsg ? '' : '<p class="hint">提示：密钥在分享链接 <code>#</code> 号的后面，请确认复制的是完整链接。</p>') +
        '</div>';

      $('keyForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const k = $('keyInput').value.trim();
        if (!k) { toast('请输入密钥'); return; }
        fetchAndDecrypt(k);
      });
    }

    /* ---------- 视图：加载中 ---------- */
    function renderLoading(text) {
      stage.innerHTML =
        '<div class="lock-state">' +
          '<span class="ls-icon">⏳</span>' +
          '<div class="ls-title">' + escapeHtml(text) + '</div>' +
          '<div class="ls-sub">正在本地派生密钥（PBKDF2 15 万次迭代），请稍候…</div>' +
        '</div>';
    }

    /* ---------- 视图：内容 ---------- */
    function renderContent(text, meta, fromCache) {
      $('pageSub').textContent = '已解密';

      const percent = meta.expiresAt
        ? Math.max(0, Math.min(100, ((meta.expiresAt - Date.now()) / (meta.expiresAt - (meta.createdAt || meta.expiresAt - 3600000))) * 100))
        : 100;

      stage.innerHTML =
        '<div class="secret-badges" style="margin:0 0 12px;">' +
          '<span class="secret-badge ok">🔓 解密成功</span>' +
          (meta.burn ? '<span class="secret-badge warn">🔥 阅后即焚 · 已从服务器销毁</span>' : '') +
          (meta.expiresAt ? '<span class="secret-badge" id="ttlBadge">⏳ 剩余加载中…</span>' : '') +
          (fromCache ? '<span class="secret-badge">💾 来自本次会话缓存</span>' : '') +
        '</div>' +
        '<div class="content-box" id="contentBox"></div>' +
        '<div class="ttl-bar"><i id="ttlFill" style="width:' + percent + '%"></i></div>' +
        '<div class="btn-row">' +
          '<button class="btn primary" id="btnCopy">📋 复制内容</button>' +
          '<button class="btn" id="btnDownload">💾 下载为 txt</button>' +
          '<button class="btn" id="btnDestroy">🧹 清除本机缓存</button>' +
        '</div>' +
        '<div class="notice-box">' +
          '内容已在你本机完成解密，明文仅临时保存在当前标签页（关闭即失效）。' +
          (meta.burn ? '该内容已在服务器上销毁，刷新页面看到的只是本机缓存。' : '请勿将内容转发给无关人员。') +
        '</div>';

      $('contentBox').textContent = text;

      if (meta.expiresAt) startCountdown(meta.expiresAt, meta.createdAt);

      $('btnCopy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(text); toast('已复制到剪贴板'); }
        catch { toast('复制失败，请手动选择复制'); }
      });

      $('btnDownload').addEventListener('click', () => {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'secret-' + (secretId || 'content') + '.txt';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast('已开始下载');
      });

      $('btnDestroy').addEventListener('click', () => {
        sessionStorage.removeItem(CACHE_KEY);
        toast('本机缓存已清除，刷新需重新输入密钥');
      });
    }

    function startCountdown(expiresAt, createdAt) {
      const badge = $('ttlBadge');
      const fill = $('ttlFill');
      const total = Math.max(1, expiresAt - (createdAt || expiresAt - 3600000));
      function tick() {
        const left = expiresAt - Date.now();
        if (badge) {
          badge.textContent = left > 0 ? '⏳ 剩余 ' + SecretCrypto.formatRemaining(left) : '⏳ 已过期';
        }
        if (fill) {
          const p = Math.max(0, Math.min(100, (left / total) * 100));
          fill.style.width = p + '%';
          fill.classList.toggle('low', p < 15);
        }
        if (left <= 0) {
          clearInterval(timer);
          if (badge) badge.className = 'secret-badge warn';
        }
      }
      tick();
      const timer = setInterval(tick, 1000);
    }

    /* ---------- 拉取并解密 ---------- */
    async function fetchAndDecrypt(keyString) {
      renderLoading('正在解密…');

      let data;
      try {
        const resp = await fetch('/api/secret/' + encodeURIComponent(secretId), {
          headers: { 'Accept': 'application/json' },
          cache: 'no-store',
        });
        data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          if (resp.status === 404) return renderInvalid('内容不存在或已被销毁');
          if (resp.status === 410) return renderInvalid('内容已过期并销毁');
          return renderInvalid((data && data.message) || '读取失败');
        }
      } catch {
        return renderInvalid('网络异常，无法读取内容');
      }

      let text;
      try {
        text = await SecretCrypto.decryptToString(data, keyString);
      } catch {
        // GCM 认证失败 = 密钥错误或密文被篡改
        return renderLock('密钥不正确，或内容已被篡改。请确认链接完整，并向分享者索取正确的密钥。');
      }

      // 解密成功：阅后即焚内容在此确认销毁（GET 阶段刻意不删，避免输错密钥就烧掉）
      let burnGone = false;
      if (data.burn) {
        try {
          const r = await fetch('/api/secret/' + encodeURIComponent(secretId) + '/burn', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });
          burnGone = r.ok;
        } catch { /* 网络失败不阻塞展示，内容仍会按有效期过期 */ }
      }

      writeCache(text, data.expiresAt, data.burn, data.createdAt);
      renderContent(text, {
        createdAt: data.createdAt,
        expiresAt: data.expiresAt,
        burn: data.burn && burnGone,
      }, false);
    }

    /* ---------- 入口 ---------- */
    (function init() {
      if (!secretId) return renderInvalid('链接格式不正确');

      // 优先用会话缓存：刷新页面时内容仍在（阅后即焚的内容此时已从服务端删除）
      const cached = readCache();
      if (cached) {
        return renderContent(cached.text, {
          createdAt: cached.createdAt,
          expiresAt: cached.expiresAt,
          burn: cached.burn,
        }, true);
      }
      if (keyFromHash) return fetchAndDecrypt(keyFromHash);
      return renderLock('');
    })();
  </script>
</body>
</html>
