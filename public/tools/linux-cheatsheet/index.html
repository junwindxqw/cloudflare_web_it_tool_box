<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux 命令速查 - Web IT Tool Box</title>
  <meta name="description" content="Linux 常用命令速查表：文件目录、查看内容、搜索、权限、进程、网络、压缩与系统信息，支持搜索与一键复制。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/common.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="/">
        <span class="logo-icon">🧰</span>
        <span>Web IT Tool Box</span>
      </a>
      <span class="header-spacer"></span>
      <a class="header-nav" href="/">🏠 返回工具箱</a>
    </div>
  </header>

  <main class="narrow">

    <div class="page-head">
      <div class="crumbs"><a href="/">工具箱</a> / Linux 命令速查</div>
      <h1><span class="icon-tile cat-ops">🐧</span>Linux 命令速查</h1>
      <p class="sub">按场景分类的 Linux 常用命令，点击命令即可复制。</p>
    </div>

    <section class="panel">
      <input type="text" id="linuxSearch" placeholder="搜索命令或说明，如：grep、查看端口、磁盘…" autocomplete="off" spellcheck="false">
    </section>

    <div id="linuxGroups"></div>

  </main>

  <footer class="site-footer">
    基于 <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a> 免费服务构建
    <span class="sep">|</span>
    <a href="https://github.com/junwindxqw/cloudflare_web_it_tool_box" target="_blank" rel="noopener">GitHub 开源</a>
  </footer>

  <div id="toast">已复制到剪贴板</div>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);

    let toastTimer = null;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }

    const GROUPS = [
      {
        name: '📁 文件与目录', items: [
          ['ls -lah', '列出文件（含隐藏、人类可读大小）'],
          ['cd ~', '进入用户主目录'],
          ['pwd', '显示当前所在路径'],
          ['mkdir -p a/b/c', '递归创建多级目录'],
          ['cp -r src dst', '递归复制目录'],
          ['mv old new', '移动 / 重命名'],
          ['rm -rf dir', '递归强制删除（极度危险，先确认路径）'],
          ['ln -s target link', '创建软链接'],
          ['touch file', '创建空文件 / 更新时间戳'],
          ['tree -L 2', '树状显示目录结构（2 层）'],
        ]
      },
      {
        name: '👀 查看与编辑', items: [
          ['cat file', '输出整个文件'],
          ['less file', '分页查看（q 退出，/ 搜索）'],
          ['head -n 20 file', '查看文件前 20 行'],
          ['tail -n 20 file', '查看文件后 20 行'],
          ['tail -f app.log', '实时追踪日志'],
          ['wc -l file', '统计文件行数'],
          ['diff a.txt b.txt', '比较两个文件差异'],
          ['vim file', '编辑文件（i 编辑，:wq 保存退出）'],
        ]
      },
      {
        name: '🔍 搜索与文本处理', items: [
          ['grep -rn "keyword" .', '递归搜索关键词（含行号）'],
          ['grep -i error app.log', '忽略大小写搜索日志'],
          ['find . -name "*.log"', '按名称查找文件'],
          ['find . -mtime -1 -type f', '查找 24 小时内修改过的文件'],
          ['awk \'{print $1}\' access.log', '按列提取（默认空格分列）'],
          ['sed -i \'s/old/new/g\' file', '批量替换文件内容'],
          ['sort | uniq -c | sort -rn', '去重并按出现次数倒序'],
          ['cut -d: -f1 /etc/passwd', '按分隔符取第 1 列'],
          ['xargs rm -f', '把上一步结果作为参数执行删除'],
        ]
      },
      {
        name: '🔐 权限与用户', items: [
          ['chmod 755 file', '设置权限 rwxr-xr-x'],
          ['chmod -R 644 dir', '递归设置目录权限'],
          ['chown user:group file', '修改文件属主与属组'],
          ['sudo -u www ls', '以其他用户身份执行'],
          ['useradd -m user', '创建用户并生成主目录'],
          ['passwd user', '修改用户密码'],
          ['id user', '查看用户 UID / GID / 组'],
          ['su - user', '切换用户（加载其环境）'],
        ]
      },
      {
        name: '⚙️ 进程与系统', items: [
          ['ps aux | grep nginx', '查找进程'],
          ['top', '实时查看 CPU / 内存（htop 更友好）'],
          ['kill -9 <pid>', '强制结束进程'],
          ['killall nginx', '按名称结束全部同名进程'],
          ['nohup ./app &', '后台运行且退出终端不中断'],
          ['jobs / fg / bg', '查看 / 前台 / 后台 任务'],
          ['uname -a', '查看内核与系统信息'],
          ['lsb_release -a', '查看发行版版本'],
          ['uptime', '运行时长与负载'],
          ['crontab -e', '编辑定时任务'],
        ]
      },
      {
        name: '🌐 网络与端口', items: [
          ['curl -I https://example.com', '查看响应头'],
          ['curl -o out.json https://api/x', '下载 / 保存接口响应'],
          ['ping -c 4 example.com', '测试连通性（4 次）'],
          ['ss -tlnp', '查看监听端口与进程（推荐）'],
          ['netstat -tlnp', '查看监听端口（旧工具）'],
          ['ip addr', '查看网卡与 IP'],
          ['traceroute example.com', '追踪路由跳数'],
          ['dig +short example.com', '快速查询 DNS'],
          ['nmap -p 1-1000 host', '扫描端口（需授权）'],
        ]
      },
      {
        name: '💾 磁盘与内存', items: [
          ['df -h', '查看磁盘空间'],
          ['du -sh *', '统计当前目录各项大小'],
          ['du -h --max-depth=1 /var', '定位大目录'],
          ['free -h', '查看内存用量'],
          ['lsblk', '查看块设备（磁盘分区）'],
          ['mount /dev/sdb1 /mnt', '挂载分区'],
          ['iostat -x 1', '查看磁盘 IO（sysstat 包）'],
        ]
      },
      {
        name: '📦 压缩与打包', items: [
          ['tar -czvf a.tar.gz dir/', '打包并 gzip 压缩'],
          ['tar -xzvf a.tar.gz', '解压 tar.gz'],
          ['tar -cjvf a.tar.bz2 dir/', '打包并 bzip2 压缩（更小）'],
          ['zip -r a.zip dir/', '创建 zip'],
          ['unzip a.zip -d out/', '解压 zip 到指定目录'],
          ['rsync -avz src/ user@host:/dst', '增量同步到远程服务器'],
        ]
      },
      {
        name: '🧰 包管理（按发行版）', items: [
          ['apt update && apt upgrade', 'Debian/Ubuntu 更新软件源与包'],
          ['apt install nginx', 'Debian/Ubuntu 安装软件'],
          ['yum install nginx', 'CentOS 7 安装软件'],
          ['dnf install nginx', 'CentOS 8+/Fedora 安装软件'],
          ['systemctl status nginx', '查看服务状态'],
          ['systemctl restart nginx', '重启服务'],
          ['journalctl -u nginx -f', '追踪服务日志'],
        ]
      },
    ];

    function render(filter) {
      const q = (filter || '').trim().toLowerCase();
      const wrap = $('linuxGroups');
      wrap.innerHTML = '';
      let shown = 0;

      GROUPS.forEach(g => {
        const items = g.items.filter(([cmd, desc]) =>
          !q || cmd.toLowerCase().includes(q) || desc.toLowerCase().includes(q));
        if (!items.length) return;
        shown += items.length;

        const panel = document.createElement('section');
        panel.className = 'panel';
        const title = document.createElement('div');
        title.className = 'panel-title';
        title.innerHTML = `<span class="dot"></span>${g.name}`;
        panel.appendChild(title);

        items.forEach(([cmd, desc]) => {
          const row = document.createElement('div');
          row.className = 'nx';
          row.style.cursor = 'pointer';
          row.title = '点击复制';
          row.innerHTML =
            `<span style="flex:1;word-break:break-all;">${cmd}</span>` +
            `<span style="font-size:12px;color:var(--muted);font-family:var(--font);flex-shrink:0;">${desc}</span>`;
          row.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(cmd);
              toast('已复制：' + cmd);
            } catch { toast('复制失败，请手动选择复制'); }
          });
          panel.appendChild(row);
        });
        wrap.appendChild(panel);
      });

      if (!shown) wrap.innerHTML = '<section class="panel"><p class="hint">没有匹配的命令，换个关键词试试。</p></section>';
    }

    $('linuxSearch').addEventListener('input', (e) => render(e.target.value));
    render('');
  </script>
</body>
</html>
